[project]
name = "router"
version = "0.1.0"
description = "Adaptive model router for software-engineering agents (Phase 1: deterministic core)"
requires-python = ">=3.10"
dependencies = ["typer", "httpx", "GitPython", "python-dotenv"]

[project.scripts]
router = "router.cli:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
